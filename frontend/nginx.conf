# nginx for the standalone web container (Render, docker compose).
#
# The nginx image renders /etc/nginx/templates/*.template into conf.d on container
# start, substituting only variables that exist in the environment -- so nginx's own
# $host / $proxy_host below are left alone.
#
#   PORT          port nginx listens on. Render sets this to 10000; 80 locally.
#   API_UPSTREAM  where /api/* is forwarded.
#                 docker compose: http://backend:8000 (the compose service name)
#                 Render:         https://<your-api>.onrender.com (public URL -- a
#                                 free Render instance cannot receive private traffic)
#
# Keeping the API behind this same origin is the point: the browser makes no
# cross-origin request, so there is no preflight to fail. See RENDER_DEPLOY.md.
server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    # Hashed CRA assets are immutable; index.html must never be cached or users
    # keep loading an old bundle after a deploy.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # API on the same origin. proxy_buffering off keeps APT's streamed chat
    # responses arriving token by token instead of in one lump at the end.
    location /api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        # $proxy_host is the upstream as written above, which is what the remote edge
        # routes on -- passing the visitor's Host through instead would 404 at Render.
        proxy_set_header Host              $proxy_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        # An https:// upstream is routed by SNI, which nginx leaves off by default.
        proxy_ssl_server_name on;
        proxy_buffering off;
        # Long enough to cover a cold start: a sleeping free API takes ~1 minute to wake.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Single-page app: every other path returns index.html and React routes it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
