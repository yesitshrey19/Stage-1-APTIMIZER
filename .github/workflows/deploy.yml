name: Deploy frontend to GitHub Pages

# Builds the React frontend under the repository path /Stage-1-APTIMIZER/ and publishes it
# to GitHub Pages. Only the static frontend is deployed: the FastAPI backend and MongoDB
# are not hosted by Pages. Point the site at a deployed backend by setting the repository
# variable BACKEND_URL (Settings → Secrets and variables → Actions → Variables), e.g.
# https://your-backend.example.com — without it the site's sign-in and projects cannot work.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push cancels a queued, not-yet-started one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        env:
          REACT_APP_BACKEND_URL: ${{ vars.BACKEND_URL }}
        # PUBLIC_URL=/Stage-1-APTIMIZER and a 404.html copy of index.html, so deep links such
        # as /Stage-1-APTIMIZER/projects/<id> load the app instead of GitHub's 404 page.
        run: npm run build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
